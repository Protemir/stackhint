name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build:check
      - run: npm test
      - run: npm run test:dist

  node20:
    name: dist on node 20
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
      - run: npm run test:dist

  real-hosts:
    name: real Claude Code and Codex (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g @openai/codex @anthropic-ai/claude-code
      - run: codex --version
      - run: claude --version
      - run: node --test tests/host-real.test.ts
        env:
          STACKHINT_REAL_HOSTS: '1'

  install-from-github:
    name: install from GitHub (${{ matrix.os }})
    if: github.event_name == 'push'
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: npx from GitHub
        shell: bash
        run: |
          out=$(npx -y "github:${GITHUB_REPOSITORY}#${GITHUB_SHA}" --version)
          echo "$out"
          test -n "$out"
      - name: Codex marketplace from GitHub
        shell: bash
        run: |
          npm install -g @openai/codex
          export CODEX_HOME="$RUNNER_TEMP/codex-home" && mkdir -p "$CODEX_HOME"
          codex plugin marketplace add "${GITHUB_REPOSITORY}@${GITHUB_SHA}"
          codex plugin list --available --json | tee list.json
          grep -q stackhint list.json
